<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, follow" />
  <meta name="theme-color" content="#08090e" />
  <title>Request received | ArborOps</title>
  <link rel="stylesheet" href="../../style.css" />
  <style>
    body { min-height: 100vh; display: grid; grid-template-rows: auto 1fr auto; }
    .page-header, .page-footer { width: min(100% - 3rem, 760px); margin-inline: auto; }
    .page-header { padding-top: 2rem; }
    .brand { font-size: 1.05rem; font-weight: 800; letter-spacing: -0.04em; }
    main { display: grid; place-items: center; padding: 4rem 1.5rem; }
    .card { width: min(100%, 560px); padding: clamp(1.5rem, 5vw, 3rem); background: var(--surface); border: 1px solid var(--border-hi); }
    .eyebrow { color: var(--muted-light); font: 500 0.72rem var(--font-mono); letter-spacing: 0.12em; text-transform: uppercase; }
    h1 { margin-top: 1rem; color: var(--white); font-size: clamp(2rem, 7vw, 3.25rem); line-height: 1.08; letter-spacing: -0.06em; }
    .message { margin-top: 1rem; color: var(--muted-light); }
    .page-footer { padding: 0 0 2rem; color: var(--muted-light); font-size: 0.78rem; }
    .page-footer a { color: var(--offwhite); text-decoration: underline; text-underline-offset: 0.2em; }
  </style>
</head>
<body>
  <header class="page-header">
    <a class="brand" href="/" aria-label="ArborOps home">ArborOps</a>
  </header>
  <main>
    <section class="card" aria-labelledby="received-title">
      <p class="eyebrow">Email preferences</p>
      <h1 id="received-title">Request received.</h1>
      <p class="message">We’ll remove your address from future ArborOps outreach.</p>
    </section>
  </main>
  <footer class="page-footer">
    <a href="/">Return to arborops.tech</a>
  </footer>
</body>
</html>
