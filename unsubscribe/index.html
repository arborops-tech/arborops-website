<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, follow" />
  <meta name="theme-color" content="#08090e" />
  <title>Unsubscribe | ArborOps</title>
  <link rel="stylesheet" href="../style.css" />
  <style>
    body { min-height: 100vh; display: grid; grid-template-rows: auto 1fr auto; }
    .unsubscribe-header, .unsubscribe-footer { width: min(100% - 3rem, 760px); margin-inline: auto; }
    .unsubscribe-header { padding-top: 2rem; }
    .brand { font-size: 1.05rem; font-weight: 800; letter-spacing: -0.04em; }
    .unsubscribe-main { display: grid; place-items: center; padding: 4rem 1.5rem; }
    .unsubscribe-card { width: min(100%, 560px); padding: clamp(1.5rem, 5vw, 3rem); background: var(--surface); border: 1px solid var(--border-hi); }
    .eyebrow { color: var(--muted-light); font: 500 0.72rem var(--font-mono); letter-spacing: 0.12em; text-transform: uppercase; }
    h1 { margin-top: 1rem; color: var(--white); font-size: clamp(2rem, 7vw, 3.25rem); line-height: 1.08; letter-spacing: -0.06em; }
    .request-form { margin-top: 2rem; }
    label { display: block; margin-bottom: 0.5rem; color: var(--offwhite); font-size: 0.88rem; font-weight: 600; }
    input[type="email"] { width: 100%; min-height: 3.25rem; padding: 0.75rem 0.9rem; border: 1px solid var(--border-hi); border-radius: 0; background: var(--bg); color: var(--white); font: inherit; }
    input[type="email"]:focus { outline: 2px solid var(--accent); outline-offset: 2px; }
    .submit-button { width: 100%; min-height: 3.25rem; margin-top: 1rem; border: 0; border-radius: 0; background: var(--accent); color: var(--white); cursor: pointer; font: 600 0.9rem var(--font-main); }
    .submit-button:hover { opacity: 0.9; }
    .unsubscribe-footer { padding: 0 0 2rem; color: var(--muted-light); font-size: 0.78rem; }
    .unsubscribe-footer a { color: var(--offwhite); text-decoration: underline; text-underline-offset: 0.2em; }
  </style>
</head>
<body>
  <header class="unsubscribe-header">
    <a class="brand" href="/" aria-label="ArborOps home">ArborOps</a>
  </header>

  <main class="unsubscribe-main">
    <section class="unsubscribe-card" aria-labelledby="unsubscribe-title">
      <p class="eyebrow">Email preferences</p>
      <h1 id="unsubscribe-title">Would you like to unsubscribe?</h1>
      <form class="request-form" action="https://formsubmit.co/build@arborops.tech" method="POST">
        <input type="hidden" name="_subject" value="Unsubscribe request from arborops.tech" />
        <input type="hidden" name="_next" value="https://www.arborops.tech/unsubscribe/received/" />
        <input type="hidden" name="request" value="Remove this address from future ArborOps outreach" />
        <label for="email">Your email address</label>
        <input id="email" name="email" type="email" autocomplete="email" required />
        <button class="submit-button" type="submit">Unsubscribe</button>
      </form>
    </section>
  </main>

  <footer class="unsubscribe-footer">
    <a href="/">Return to arborops.tech</a>
  </footer>

  <script>
    (() => {
      const emailInput = document.getElementById('email');
      const params = new URLSearchParams(window.location.search);
      const suppliedEmail = params.get('email');

      if (suppliedEmail) emailInput.value = suppliedEmail.trim();
    })();
  </script>
</body>
</html>
